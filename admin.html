<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mombasa CTO - Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a110c;
        }

        ::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-[#1a110c] text-stone-200 min-h-screen flex flex-col">

    <nav class="w-full bg-[#1a1311] border-b border-white/5 p-4 md:px-8 flex justify-between items-center gap-4 z-50">

        <div class="flex items-center gap-2">
            <div class="bg-amber-500/20 p-2 rounded-xl text-amber-500 border border-amber-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h1 class="text-lg md:text-2xl font-black text-white tracking-widest">
                CTO<span class="text-amber-500">STAFF.</span>
            </h1>
        </div>

        <div id="staff-user-info"
            class="hidden items-center gap-3 md:gap-5 bg-black/40 px-4 py-2.5 rounded-2xl border border-white/5 shadow-inner">

            <!-- FIX: Changed items-end to items-center -->
            <div class="flex flex-col items-center justify-center">
                <span id="user-role-label"
                    class="text-[9px] text-stone-500 font-bold uppercase tracking-widest">ROLE</span>

                <!-- FIX: Added text-center just in case the name gets long -->
                <span id="admin-user-name"
                    class="text-xs md:text-sm font-bold text-amber-500 truncate max-w-[100px] md:max-w-[150px] text-center">Loading...</span>
            </div>

            <div class="w-px h-6 bg-white/10 hidden md:block"></div>

            <button onclick="handleStaffLogOut()"
                class="text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-3 md:px-4 py-1.5 md:py-2 rounded-xl text-xs md:text-sm font-bold transition border border-red-500/20">
                Log Out
            </button>
        </div>

    </nav>

    <div id="staff-login-section" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-[#2c1e16] border border-white/10 rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-extrabold text-white mb-2">Staff Portal Login</h2>
            <p class="text-stone-400 text-sm mb-6">Authorized personnel only.</p>

            <form id="staff-login-form" onsubmit="handleStaffLogin(event)" class="flex flex-col gap-4">
                <div>
                    <label class="text-[11px] text-stone-400 font-semibold uppercase tracking-wider mb-1 block">Staff
                        Email</label>
                    <input type="email" id="login-email" required
                        class="w-full bg-black/40 text-stone-200 text-sm px-4 py-3 rounded-xl border border-white/5 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label
                        class="text-[11px] text-stone-400 font-semibold uppercase tracking-wider mb-1 block">Password</label>
                    <input type="password" id="login-password" required
                        class="w-full bg-black/40 text-stone-200 text-sm px-4 py-3 rounded-xl border border-white/5 focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit"
                    class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg shadow-amber-900/40">Access
                    Dashboard</button>
            </form>
        </div>
    </div>

    <div id="staff-dashboard-section" class="hidden flex-1 flex flex-col p-6 lg:p-10 max-w-[1400px] mx-auto w-full">
        <div class="flex gap-4 mb-6 border-b border-white/5 pb-4">
            <button onclick="switchTab('kitchen')" id="tab-kitchen"
                class="px-6 py-2 rounded-lg font-bold transition-all bg-amber-500 text-[#1a110c]">
                👨‍🍳 Kitchen View
            </button>
            <button onclick="switchTab('rider')" id="tab-rider"
                class="px-6 py-2 rounded-lg font-bold transition-all bg-white/5 text-stone-400 hover:text-white">
                🛵 Rider View
            </button>
        </div>

        <div id="kitchen-view-container" class="block">
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-6">Live Kitchen Feed</h1>
            <div id="live-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>

        <div id="rider-view-container" class="hidden">
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-6">Delivery Routes</h1>
            <div id="rider-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>
    </div>
    <!-- ========================================== -->
    <!-- CUSTOM THEMED MODAL (ALERTS & CONFIRMS) -->
    <!-- ========================================== -->
    <div id="custom-modal-overlay"
        class="fixed inset-0 bg-black/80 z-[999] hidden flex items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div
            class="bg-[#2c1e16] border border-amber-900/30 p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 flex flex-col items-center text-center">

            <div id="custom-modal-icon" class="text-amber-500 mb-3 text-4xl">
                <!-- Icon will be injected here -->
            </div>

            <h3 id="custom-modal-title" class="text-xl font-bold text-white mb-2 tracking-wide">Title</h3>
            <p id="custom-modal-message" class="text-sm text-stone-300 mb-6 leading-relaxed">Message goes here</p>

            <!-- Buttons Container -->
            <div id="custom-modal-actions" class="flex w-full gap-3">
                <!-- Buttons dynamically injected via JS -->
            </div>

        </div>
    </div>
    <script type="module">
        // Import Firebase tools
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, doc, getDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrwuiHQVAAGpeyKswJ19TXzPyAwfaW8fU",
            authDomain: "mombasa-cto.firebaseapp.com",
            projectId: "mombasa-cto",
            storageBucket: "mombasa-cto.firebasestorage.app",
            messagingSenderId: "725798162014",
            appId: "1:725798162014:web:476760e0d358c0b8b72ecf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose to window so our HTML buttons can click them
        window.auth = auth;
        window.db = db;
        window.collection = collection;
        window.query = query;
        window.orderBy = orderBy;
        window.getDocs = getDocs; // <--- This will now work perfectly!
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;
        window.limit = limit;

        // UI Elements
        const loginSection = document.getElementById('staff-login-section');
        const dashboardSection = document.getElementById('staff-dashboard-section');
        const staffUserInfo = document.getElementById('staff-user-info');

        // --- XSS SANITIZER (Stops hackers from injecting malicious code into orders) ---
        function sanitize(str) {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }
        // ==========================================
        // 1. THE OBSERVER (The VIP Bouncer)
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // CHECK THE VIP LIST
                    const userRef = doc(db, "users", user.email.toLowerCase());
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        const userRole = userData.role; // "admin" or "chef"

                        // Save this globally
                        window.currentUserRole = userRole;
                        window.currentStaffEmail = user.email;

                        // --- THE NEW RIDER ZONE VARIABLE ---
                        window.currentRiderZone = userData.zone || "Unassigned";
                        // -----------------------------------

                        // Show the dashboard
                        loginSection.classList.add('hidden');
                        dashboardSection.classList.remove('hidden');
                        dashboardSection.classList.add('flex');

                        staffUserInfo.classList.remove('hidden');
                        staffUserInfo.classList.add('flex');

                        // Update header name and dynamic role
                        const displayName = user.displayName || user.email.split('@')[0];

                        // 1. Set the bottom amber text to ONLY the user's name
                        document.getElementById('admin-user-name').innerText = displayName;

                        // 2. Set the top grey text to the user's actual role (ADMIN, CHEF, or RIDER)
                        const roleLabel = document.getElementById('user-role-label');
                        if (roleLabel) {
                            roleLabel.innerText = userRole.toUpperCase();
                        }

                        // --- NEW: UI ROLE RESTRICTIONS (Bulletproof Hide) ---
                        const riderTab = document.getElementById('tab-rider');
                        const kitchenTab = document.getElementById('tab-kitchen');

                        if (riderTab && kitchenTab) {
                            if (userRole === "chef") {
                                // Forcibly hide Rider tab for Chefs
                                riderTab.style.display = "none";
                                kitchenTab.style.display = "flex";
                                switchTab('kitchen'); // Force them onto the kitchen view
                            } else if (userRole === "rider") {
                                // Forcibly hide Kitchen tab for Riders
                                kitchenTab.style.display = "none";
                                riderTab.style.display = "flex";
                                switchTab('rider'); // Force them onto the rider view
                            } else {
                                // Admins see everything
                                riderTab.style.display = "flex";
                                kitchenTab.style.display = "flex";
                            }
                        }
                        // ---------------------------------

                        // Start fetching orders
                        window.startOrderListener();
                    } else {
                        await signOut(auth);
                        alert("Access Denied: You do not have staff permissions to view this portal.");
                    }
                } catch (error) {
                    console.error("Security verification failed:", error);
                    alert("Error verifying permissions. Please contact the CTO.");
                }
            } else {
                // --- THE LOGOUT FIX: Turn off the live listener! ---
                if (window.orderListener) {
                    window.orderListener(); // This kills the active connection
                    window.orderListener = null;
                }

                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                dashboardSection.classList.remove('flex');

                staffUserInfo.classList.add('hidden');
                staffUserInfo.classList.remove('flex');
            }
        });

        // ==========================================
        // 2. STAFF LOGIN & LOGOUT
        // ==========================================
        window.handleStaffLogin = async function (event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // The observer will automatically handle the screen switch!
            } catch (error) {
                console.error("Admin Login Error:", error);

                // Replace the native alert with the custom error modal
                window.showModal(
                    "Login Failed",
                    "Check credentials or contact the owner.",
                    "error"
                );
            }
        };

        window.handleStaffLogOut = function () {
            window.showModal(
                'Sign Out',
                'Are you sure you want to log out of the admin panel?',
                'confirm',
                async () => {
                    try {
                        await signOut(auth);
                    } catch (error) {
                        console.error("Logout Error:", error);
                        window.showModal("Error", "Failed to log out. Please try again.", "error");
                    }
                },
                'Yes, Log Out', // <-- Custom Confirm Button
                'Cancel'        // <-- Custom Cancel Button
            );
        };
        // ==========================================
        // UI: TAB SWITCHING
        // ==========================================
        window.switchTab = function (tabName) {
            const kitchenContainer = document.getElementById('kitchen-view-container');
            const riderContainer = document.getElementById('rider-view-container');
            const tabKitchen = document.getElementById('tab-kitchen');
            const tabRider = document.getElementById('tab-rider');

            // Active Class (Amber Background, Dark Text)
            const activeClass = "px-6 py-2 rounded-lg font-bold transition-all bg-amber-500 text-[#1a110c]";
            // Inactive Class (Faded Background, Light Text)
            const inactiveClass = "px-6 py-2 rounded-lg font-bold transition-all bg-white/5 text-stone-400 hover:text-white";

            if (tabName === 'kitchen') {
                kitchenContainer.classList.remove('hidden');
                riderContainer.classList.add('hidden');
                tabKitchen.className = activeClass;
                tabRider.className = inactiveClass;
            } else {
                kitchenContainer.classList.add('hidden');
                riderContainer.classList.remove('hidden');
                tabRider.className = activeClass;
                tabKitchen.className = inactiveClass;
            }
        };
        // ==========================================
        // 3. LISTEN FOR LIVE ORDERS (Dual-Feed with Roles)
        // ==========================================
        let orderListener = null;

        window.startOrderListener = function () {
            const kitchenGrid = document.getElementById('live-orders-grid');
            const riderGrid = document.getElementById('rider-orders-grid');

            kitchenGrid.innerHTML = `<div class="col-span-full text-center text-amber-500 font-bold animate-pulse py-10">Connecting...</div>`;
            riderGrid.innerHTML = `<div class="col-span-full text-center text-amber-500 font-bold animate-pulse py-10">Connecting...</div>`;

            try {
                const q = window.query(window.collection(window.db, "orders"), window.orderBy("timestamp", "desc"), window.limit(50));
                if (window.orderListener) window.orderListener(); // Clear old listener if it exists

                window.orderListener = window.onSnapshot(q, (querySnapshot) => {
                    kitchenGrid.innerHTML = '';
                    riderGrid.innerHTML = '';

                    let kitchenCount = 0;
                    let riderCount = 0;

                    querySnapshot.forEach((documentSnapshot) => {
                        const rawOrder = { id: documentSnapshot.id, ...documentSnapshot.data() };

                        // --- THE FIX: Match the exact labels sent by the checkout script ---
                        const currentStatus = rawOrder.status || "pending";
                        const currentTotal = rawOrder.totalAmount || 0;

                        // --- 1. THE CHEF & RIDER FILTERS ---
                        let myItems = rawOrder.items || [];

                        if (window.currentUserRole === "chef") {
                            // Filter the cart to ONLY include items tagged with this chef's email
                            myItems = myItems.filter(item => item.ownerEmail === window.currentStaffEmail);

                            // If this order has NONE of their food, skip this order entirely!
                            if (myItems.length === 0) return;

                        } else if (window.currentUserRole === "rider") {
                            // Check if ANY item in this order is located in the rider's assigned zone
                            const hasItemsInMyZone = myItems.some(item => item.pickupZone === window.currentRiderZone);

                            // If the order has no food from their zone, skip this order entirely!
                            if (!hasItemsInMyZone) return;
                        }

                        // --- 2. THE PRICE RECALCULATOR (Vendor Commission Update) ---
                        let displayTotal = currentTotal; // Admins and Riders see the full customer payment
                        let totalLabel = "Total";

                        if (window.currentUserRole === "chef") {
                            // 1. Calculate the raw subtotal for ONLY the food this specific chef is cooking
                            const chefRawSubtotal = myItems.reduce((sum, item) => sum + (item.price * item.qty), 0);

                            // 2. Calculate the 10% Platform Fee 
                            const chefPlatformFee = Math.ceil(chefRawSubtotal * 0.10);

                            // 3. Set the display total to the chef's actual take-home pay
                            displayTotal = chefRawSubtotal - chefPlatformFee;

                            // Change the label so they know this is their cut!
                            totalLabel = "Your Payout";
                        }

                        // --- 3. XSS SANITIZER & DATA EXTRACTION ---
                        const safeEmail = sanitize(rawOrder.customerEmail);
                        const safePhone = sanitize(rawOrder.customerPhone || "No Phone");
                        const safeArea = sanitize(rawOrder.deliveryArea);
                        const safeDate = sanitize(rawOrder.deliveryDate || "Today");
                        const safeTime = sanitize(rawOrder.deliveryTime || "ASAP");
                        // --- NEW: Dynamic Name Logic ---
                        const fallbackName = safeEmail.includes('@') ? safeEmail.split('@')[0] : "Customer";
                        const finalCustomerName = rawOrder.customerName ? sanitize(rawOrder.customerName) : fallbackName;

                        // Extract Chef Details from the split ticket
                        const chefEmail = sanitize(rawOrder.ownerEmail || "Unknown Chef");
                        const chefName = sanitize(myItems[0]?.chef || "Unknown Chef");
                        const chefPhone = sanitize(rawOrder.chefPhone || "Not Provided");
                        const pickupLocation = sanitize(rawOrder.pickupZone || "Pickup Zone");

                        // Build the items list using myItems, NOT the raw cart!
                        const itemsList = myItems.map(i => `<li class="text-sm text-stone-300">• ${i.qty}x ${i.title}</li>`).join('');

                        // --- DYNAMICALLY BUILD THE TOTAL SECTION BASED ON ROLE ---
                        let roleBasedTotalHTML = "";

                        // 1. Admin & Rider View (Both need the full breakdown for cash collection)
                        if (window.currentUserRole === "admin" || window.currentUserRole === "rider") {
                            roleBasedTotalHTML = `
                                <div class="text-xs text-stone-300 space-y-0.5 mt-2">
                                    <p>Food: <span class="font-bold">Ksh ${(rawOrder.foodSubtotal || 0).toLocaleString()}</span></p>
                                    <p>Delivery: <span class="font-bold text-amber-500">+ Ksh ${(rawOrder.deliveryFee || 0).toLocaleString()}</span></p>
                                    <p class="text-sm text-white border-t border-white/10 pt-1 mt-1">
                                        Grand Total: <strong class="text-amber-400">Ksh ${((rawOrder.foodSubtotal || 0) + (rawOrder.deliveryFee || 0)).toLocaleString()}</strong>
                                    </p>
                                </div>
                            `;
                        } 
                        // 2. Chef View (Only sees their specific food payout)
                        else if (window.currentUserRole === "chef") {
                            roleBasedTotalHTML = `<span class="text-sm text-stone-300">Chef Payout: <strong class="text-white">Ksh ${displayTotal.toLocaleString()}</strong></span>`;
                        }

                        // Build the generic card HTML

                        // Build the generic card HTML
                        let baseCard = `
                            <div class="bg-[#2c1e16] border border-white/5 p-5 rounded-2xl shadow-xl flex flex-col transition-all duration-500 hover:border-white/10">
                                <div class="flex justify-between items-start border-b border-white/10 pb-4 mb-4">
                                    <div>
                                        <span class="text-[10px] text-stone-400 font-bold uppercase tracking-wider block mb-1">ID: ${rawOrder.id.slice(0, 6)}</span>
                                        
                                        <!-- UPGRADED: INJECT THE ROLE-SPECIFIC TOTAL HTML HERE -->
                                        ${roleBasedTotalHTML}
                                        
                                    </div>
                                    <span class="px-2.5 py-1 rounded-md text-[10px] font-bold text-white uppercase tracking-wider STATUS_COLOR">
                                        ${currentStatus}
                                    </span>
                                </div>
                                <div class="flex-1 mb-2">
                                    
                                    <!-- ========================================== -->
                                    <!-- NEW: SPLIT PICKUP AND DROPOFF UI -->
                                    <!-- ========================================== -->
                                    <div class="bg-black/20 p-3 rounded-xl border border-white/5 mb-4 text-xs">
                                        
                                        <!-- CHEF PICKUP -->
                                        <div class="border-b border-white/10 pb-3 mb-3">
                                            <p class="text-[10px] text-amber-500 font-bold uppercase tracking-wider mb-2">1. Pick Up From:</p>
                                            <div class="space-y-1.5 pl-1">
                                                <p class="text-stone-300">🧑‍🍳 ${chefName}</p>
                                                <p class="text-orange-400">📞 <a href="tel:${chefPhone}" class="hover:underline">${chefPhone}</a></p>
                                                <p class="text-stone-400">🏪 ${pickupLocation}</p>
                                            </div>
                                        </div>
                                        
                                        <!-- CUSTOMER DROPOFF -->
                                        <div>
                                            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-wider mb-2">2. Deliver To:</p>
                                            <div class="space-y-1.5 pl-1">
                                                <p class="text-stone-300 font-bold">👤 ${finalCustomerName}</p>
                                                <p class="text-orange-400">📞 <a href="tel:${safePhone}" class="hover:underline">${safePhone}</a></p>
                                                <p class="text-stone-400">📍 ${safeArea} - ${safeDate} (${safeTime})</p>
                                                <p class="text-amber-500 font-semibold mt-1">📝 Notes: ${sanitize(rawOrder.deliveryNotes || "None")}</p>
                                                <p class="text-[10px] text-stone-500 uppercase tracking-wider mt-1">💳 ${sanitize(rawOrder.paymentMethod || "M-Pesa")}</p>
                                            </div>
                                        </div>
                                        
                                    </div>
                                    <!-- ========================================== -->

                                    <h3 class="text-[10px] text-amber-500 font-bold uppercase tracking-wider mb-2">Order Items</h3>
                                    <ul class="space-y-1 mb-2 pl-1">${itemsList}</ul>
                                </div>
                                ACTION_BUTTON
                                ADMIN_CANCEL_BUTTON <!-- NEW PLACEHOLDER -->
                            </div>`;

                        // --- THE ADMIN ESCAPE HATCH ---
                        let adminCancelBtn = "";
                        if (window.currentUserRole === "admin" && currentStatus !== "Cancelled" && currentStatus !== "Delivered") {
                            adminCancelBtn = `<button onclick="window.forceCancelOrder('${rawOrder.id}')" class="w-full mt-2 bg-red-950/50 hover:bg-red-900 text-red-400 border border-red-900/50 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-lg">🚨 Force Cancel (Admin)</button>`;
                        }

                        // Sort into KITCHEN or RIDER based on status
                        if (currentStatus.toLowerCase() === "pending") {
                            kitchenCount++;
                            kitchenGrid.innerHTML += baseCard
                                .replace('STATUS_COLOR', 'bg-amber-500')
                                .replace('ACTION_BUTTON', `<button onclick="updateOrderStatus('${rawOrder.id}', 'Preparing')" class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-xl text-sm font-bold">Accept & Prepare</button>`)
                                .replace('ADMIN_CANCEL_BUTTON', adminCancelBtn);
                        }
                        else if (currentStatus === "Preparing") {
                            kitchenCount++;
                            kitchenGrid.innerHTML += baseCard
                                .replace('STATUS_COLOR', 'bg-blue-500')
                                .replace('ACTION_BUTTON', `<button onclick="updateOrderStatus('${rawOrder.id}', 'Ready for Delivery')" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-bold">Food is Ready</button>`)
                                .replace('ADMIN_CANCEL_BUTTON', adminCancelBtn);
                        }
                        else if (currentStatus === "Ready for Delivery") {
                            kitchenCount++;
                            riderCount++;

                            const waitingCard = baseCard.replace('STATUS_COLOR', 'bg-purple-500').replace('ADMIN_CANCEL_BUTTON', adminCancelBtn);
                            kitchenGrid.innerHTML += waitingCard.replace('ACTION_BUTTON', `<div class="w-full mt-4 bg-black/20 text-stone-400 py-2.5 rounded-xl text-sm font-bold text-center border border-white/5">Waiting for Rider</div>`);
                            riderGrid.innerHTML += waitingCard.replace('ACTION_BUTTON', `<button onclick="updateOrderStatus('${rawOrder.id}', 'Out for Delivery')" class="w-full mt-4 bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl text-sm font-bold">Start Delivery Run</button>`);
                        }
                        else if (currentStatus === "Out for Delivery") {
                            riderCount++;
                            riderGrid.innerHTML += baseCard
                                .replace('STATUS_COLOR', 'bg-orange-500')
                                .replace('ACTION_BUTTON', `<button onclick="updateOrderStatus('${rawOrder.id}', 'Delivered')" class="w-full mt-4 bg-orange-600 hover:bg-orange-500 text-white py-2.5 rounded-xl text-sm font-bold">Mark as Delivered</button>`)
                                .replace('ADMIN_CANCEL_BUTTON', adminCancelBtn);
                        }
                    });

                    if (kitchenCount === 0) kitchenGrid.innerHTML = `<div class="col-span-full text-center text-stone-500 py-10">No active kitchen orders.</div>`;
                    if (riderCount === 0) riderGrid.innerHTML = `<div class="col-span-full text-center text-stone-500 py-10">No deliveries pending.</div>`;

                }, (error) => {
                    console.error("Live feed error: ", error);
                });

            } catch (error) {
                console.error("Setup error: ", error);
            }
        };

        window.forceCancelOrder = function (orderId) {
            window.showModal(
                'Cancel Order?',
                'Are you sure you want to completely cancel this order?',
                'confirm',
                async () => {
                    try {
                        const orderRef = window.doc(window.db, "orders", orderId);
                        await window.updateDoc(orderRef, { status: "cancelled" });
                        window.showModal("Cancelled", "The order has been successfully cancelled.", "alert");
                    } catch (error) {
                        console.error("Cancel Error:", error);
                        window.showModal("Error", "Failed to cancel the order.", "error");
                    }
                },
                'Yes, Cancel',
                'No'
            );
        };
        // ==========================================
        // 4. UPDATE ORDER STATUS (Chef Action)
        // ==========================================
        window.updateOrderStatus = async function (orderId, newStatus) {
            try {
                // Point directly to the specific order document
                const orderRef = window.doc(window.db, "orders", orderId);

                // THE FIX: Changed 'orderStatus' to 'status' to match the new M-Pesa checkout!
                await window.updateDoc(orderRef, {
                    status: newStatus
                });

                // NOTE: We completely removed the refresh function here!
                // Firebase onSnapshot will automatically detect this update and redraw the screen.

            } catch (error) {
                console.error("Error updating status:", error);
                alert("Failed to update order status. Please try again.");
            }
        };
        // ==========================================
        // CUSTOM MODAL CONTROLLER (SMART BUTTONS & SCOPE FIX)
        // ==========================================
        window.showModal = function (title, message, type = 'alert', onConfirm = null, confirmText = 'Confirm', cancelText = 'Cancel') {
            const overlay = document.getElementById('custom-modal-overlay');
            const innerModal = overlay.querySelector('div');
            const titleEl = document.getElementById('custom-modal-title');
            const messageEl = document.getElementById('custom-modal-message');
            const actionsEl = document.getElementById('custom-modal-actions');
            const iconEl = document.getElementById('custom-modal-icon');

            titleEl.innerText = title;
            messageEl.innerText = message;
            titleEl.className = "text-xl font-bold text-white mb-2 tracking-wide";

            if (type === 'confirm') {
                iconEl.innerHTML = '⚠️';
                // FIXED: Added window.closeModal() here
                actionsEl.innerHTML = `
            <button onclick="window.closeModal()" class="flex-1 py-2.5 rounded-xl text-sm font-bold bg-black/20 text-stone-400 border border-white/10 hover:bg-black/40 hover:text-white transition">${cancelText}</button>
            <button id="modal-confirm-btn" class="flex-1 py-2.5 rounded-xl text-sm font-bold bg-amber-600 text-white hover:bg-amber-500 transition shadow-lg shadow-amber-900/40">${confirmText}</button>
        `;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    window.closeModal(); // FIXED: Added window. prefix
                    if (onConfirm) onConfirm();
                };
            } else if (type === 'error') {
                iconEl.innerHTML = '❌';
                titleEl.className = "text-xl font-bold text-red-400 mb-2 tracking-wide";
                // FIXED: Added window.closeModal() here
                actionsEl.innerHTML = `
            <button onclick="window.closeModal()" class="w-full py-2.5 rounded-xl text-sm font-bold bg-red-950/80 text-red-400 border border-red-900/50 hover:bg-red-900 hover:text-white transition shadow-lg">Try Again</button>
        `;
            } else {
                iconEl.innerHTML = '✅';
                // FIXED: Added window.closeModal() here
                actionsEl.innerHTML = `
            <button onclick="window.closeModal()" class="w-full py-2.5 rounded-xl text-sm font-bold bg-amber-600 text-white hover:bg-amber-500 transition shadow-lg shadow-amber-900/40">Got it</button>
        `;
            }

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                innerModal.classList.remove('scale-95');
                innerModal.classList.add('scale-100');
            }, 10);
        };

        // Make sure this is directly below window.showModal!
        window.closeModal = function () {
            const overlay = document.getElementById('custom-modal-overlay');
            if (!overlay) return; // Safety check
            const innerModal = overlay.querySelector('div');

            overlay.classList.add('opacity-0');
            innerModal.classList.remove('scale-100');
            innerModal.classList.add('scale-95');

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        };
    </script>
</body>

</html>
